# ============================================================================
# Synora backend - application configuration.
# Real values are injected via environment variables (see compose.base.yml).
# ============================================================================
spring:
  application.name: mindease-backend
  profiles.active: ${SPRING_PROFILES_ACTIVE:dev}

  data:
    mongodb:
      uri: ${SPRING_DATA_MONGODB_URI:mongodb://mindease:change-me@mongo:27017/mindease?authSource=admin}
      auto-index-creation: true
    redis:
      host: ${SPRING_DATA_REDIS_HOST:redis}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      password: ${SPRING_DATA_REDIS_PASSWORD:}
      timeout: 2s

  # Password-reset email (SMTP). When unset the backend skips e-mail delivery
  # but the reset flow still completes, so local/dev runs never need a server.
  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    from: ${MAIL_FROM:mindease@localhost}
    properties:
      mail.smtp.auth: ${MAIL_SMTP_AUTH:true}
      mail.smtp.starttls.enable: ${MAIL_SMTP_STARTTLS:true}

  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

  # AI job queue transport.
  rabbitmq:
    host: ${SPRING_RABBITMQ_HOST:rabbitmq}
    port: ${SPRING_RABBITMQ_PORT:5672}
    username: ${SPRING_RABBITMQ_USERNAME:mindease}
    password: ${SPRING_RABBITMQ_PASSWORD:change-me-dev-rabbit}

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

management:
  endpoints.web.exposure.include: health,info,metrics,prometheus
  endpoint.health.show-details: always
  health:
    mongo.enabled: true
    redis.enabled: true
    mail.enabled: ${MAIL_HEALTH_ENABLED:false}
    readiness-state.enabled: true

# ---------------------------------------------------------------------------
mindease:
  jwt:
    # Base64-encoded HMAC secret (>= 256 bits). The default is a dev-only
    # placeholder — always override MINDEASE_JWT_SECRET outside local runs.
    secret: ${MINDEASE_JWT_SECRET:MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=}
    issuer: ${JWT_ISSUER:mindease}
    access-expiration: ${JWT_ACCESS_TTL:15m}
    refresh-expiration: ${JWT_REFRESH_TTL:7d}

  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:*}

  rate-limit:
    default-limit: ${RATE_LIMIT_DEFAULT:120}
    auth-limit: ${RATE_LIMIT_AUTH:10}
    window: ${RATE_LIMIT_WINDOW:1m}

  otp:
    length: ${OTP_LENGTH:6}
    expiration: ${OTP_EXPIRATION:10m}
    max-attempts: ${OTP_MAX_ATTEMPTS:5}

  audit:
    enabled: ${AUDIT_ENABLED:true}

  journal:
    # AES-256-GCM key material for journal title/body at rest, derived with
    # SHA-256. Required outside dev/test (see JournalEncryptionStartupValidator).
    encryption-key: ${JOURNAL_ENCRYPTION_KEY:}
    migrate-plaintext: ${JOURNAL_MIGRATE_PLAINTEXT:true}

  combined:
    # Redis TTL for the combined mental + physical insight (AI call cache).
    cache-ttl: ${COMBINED_INSIGHT_CACHE_TTL:30m}

  ai:
    tasks-queue: ${RABBITMQ_QUEUE_AI_TASKS:ai_tasks}
    max-attempts: ${AI_JOBS_MAX_ATTEMPTS:3}
    # Required - no safe default. Supplied via AI_INTERNAL_API_KEY; the
    # InternalKeyStartupValidator fails startup on a blank/placeholder key
    # outside the dev and test profiles.
    internal-api-key: ${AI_INTERNAL_API_KEY:}
    claim-timeout: ${AI_JOBS_CLAIM_TIMEOUT:5m}
    stale-sweep-interval: ${AI_JOBS_STALE_SWEEP_INTERVAL:60000}
    # Clients append endpoint paths (e.g. /mood/analyze) directly, so the
    # default MUST keep the /api/v1 suffix like the code-level defaults do;
    # without it bare local runs build unprefixed URLs that 404.
    service-url: ${AI_SERVICE_URL:http://mindease-ai-service:8000/api/v1}

  gemini:
    api-key: ${GEMINI_API_KEY:}
    model: ${GEMINI_MODEL:gemini-3.5-flash}
    timeout-seconds: ${GEMINI_TIMEOUT_SECONDS:30}
    max-output-tokens: ${GEMINI_MAX_OUTPUT_TOKENS:1024}
    temperature: ${GEMINI_TEMPERATURE:0.7}

  coach:
    rag-enabled: ${COACH_RAG_ENABLED:true}
    max-conversation-history: ${COACH_MAX_HISTORY:20}

  media:
    url: ${MINIO_URL:http://minio:9090}
    # Public address used in presigned image/audio URLs. This must be reachable
    # from the mobile client; the internal Docker hostname is not.
    public-url: ${MINIO_PUBLIC_URL:}
    access-key: ${MINIO_ACCESS_KEY:mindease}
    secret-key: ${MINIO_SECRET_KEY:change-me-dev-minio}
    bucket: ${MINIO_BUCKET:mindease-files}
    # AES-256-GCM key material for journal media (image/audio/video) at rest,
    # derived with SHA-256 and sealed in 1 MiB chunks. When blank, media is
    # stored unencrypted exactly as before.
    encryption-key: ${MEDIA_ENCRYPTION_KEY:}
    # Signing secret for the per-object download token; falls back to the
    # encryption key when unset.
    access-secret: ${MEDIA_ACCESS_SECRET:}

# ---------------------------------------------------------------------------
logging:
  level:
    root: INFO
    com.mindease: ${LOGGING_LEVEL_COM_MINDEASE:DEBUG}
    AUDIT: INFO
  pattern.console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] %logger{36} - %msg%n"

---
spring.config.activate.on-profile: prod
logging.level.com.mindease: INFO
