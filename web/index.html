<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="MindEase: AI-based mental health screening and support guidance.">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#2E9E8B">

  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="MindEase">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <link rel="icon" type="image/png" href="icons/favicon.png" sizes="32x32">
  <link rel="icon" type="image/png" href="icons/Icon-192.png" sizes="192x192">

  <link rel="manifest" href="manifest.json">

  <title>MindEase</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">

  <style>
    body {
      margin: 0;
      background: #F6FAF8;
      font-family: 'Roboto', system-ui, sans-serif;
    }
    #loading {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #2E9E8B 0%, #5FBF9E 100%);
      color: #FFFFFF;
    }
    #loading .logo {
      width: 88px;
      height: 88px;
      margin-bottom: 20px;
    }
    #loading .spinner {
      width: 36px;
      height: 36px;
      border: 4px solid rgba(255, 255, 255, 0.3);
      border-top-color: #FFFFFF;
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
    }
    #loading .text {
      margin-top: 16px;
      font-size: 15px;
      letter-spacing: 0.4px;
      opacity: 0.92;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div id="loading">
    <img class="logo" src="icons/Icon-192.png" alt="MindEase">
    <div class="spinner"></div>
    <div class="text">Loading MindEase…</div>
  </div>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
