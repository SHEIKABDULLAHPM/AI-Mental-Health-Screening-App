# ============================================================================
# Synora - Base Docker Compose (shared by dev & prod entry points)
# The project `name` is declared in the *entry* file (docker-compose.yml or
# docker-compose.prod.yml) so dev and prod never share containers/networks.
# All values come from the root .env file (cp .env.example .env).
# Internal services (databases, queues, vector, storage) are NEVER published
# to the host; they only exist on the `internal` Docker network.
# ============================================================================

x-environment: &common-env
  ENVIRONMENT: ${ENVIRONMENT:-development}
  TZ: ${TIMEZONE:-UTC}
  SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}

services:

  # --------------------------------------------------------------- MongoDB
  mongo:
    image: mongo:7.0
    container_name: mindease-mongo
    restart: unless-stopped
    networks: [internal]
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME:-mindease}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD:?set in .env}
      MONGO_INITDB_DATABASE: ${MONGO_INITDB_DATABASE:-mindease}
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet",
             "mongodb://${MONGO_INITDB_ROOT_USERNAME:-mindease}:${MONGO_INITDB_ROOT_PASSWORD:?set in .env}@localhost:27017/mindease?authSource=admin",
             "--eval", "db.adminCommand('ping').ok"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 20s

  # ------------------------------------------------------------------ Redis
  redis:
    image: redis:7-alpine
    container_name: mindease-redis
    restart: unless-stopped
    networks: [internal]
    command: >
      sh -c 'redis-server --appendonly yes --requirepass "$$REDIS_PASSWORD"'
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set in .env}
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $$REDIS_PASSWORD ping | grep PONG"]
      interval: 10s
      timeout: 10s
      retries: 10

  # ------------------------------------------------------------ RabbitMQ
  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: mindease-rabbitmq
    restart: unless-stopped
    networks: [internal]
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-mindease}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:?set in .env}
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      timeout: 10s
      retries: 10

  # ------------------------------------------------------------- Qdrant (RAG)
  qdrant:
    image: qdrant/qdrant:v1.9.7
    container_name: mindease-qdrant
    restart: unless-stopped
    networks: [internal]
    volumes:
      - qdrant-data:/qdrant/storage
    healthcheck:
      test:
        - CMD
        - bash
        - -c
        - 'exec 3<>/dev/tcp/127.0.0.1/6333 && printf "GET /readyz HTTP/1.0\r\nHost: localhost\r\n\r\n" >&3 && head -n1 <&3 | grep -q "200 OK"'
      interval: 15s
      timeout: 10s
      retries: 12
      start_period: 15s

  # ------------------------------------------------------ RAG KB seeding
  # Populates the Qdrant `mindease_chunks` collection from the curated
  # knowledge-base (NICE/NIMH/WHO PDFs) so RAG grounding is never silently
  # empty. Reuses the ai-service image (same embedding model + Qdrant client).
  # Idempotent; runs once per `docker compose up`.
  rag-seed:
    image: ${AI_SERVICE_IMAGE:-mindease/ai-service:local}
    build:
      context: ../ai-service
      dockerfile: Dockerfile
    container_name: mindease-rag-seed
    restart: "no"
    networks: [frontend, internal]
    depends_on:
      qdrant:
        condition: service_healthy
    volumes:
      - ../knowledge-base:/app/knowledge-base:ro
    environment:
      QDRANT_URL: ${QDRANT_URL:-http://qdrant:6333}
      QDRANT_COLLECTION: ${QDRANT_COLLECTION:-mindease_chunks}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-sentence-transformers/all-MiniLM-L6-v2}
      # Use the embedding model baked into the image (/app/model-cache).
      # Without these, sentence-transformers re-checks huggingface.co on every
      # load; this container must not depend on runtime model downloads.
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
    command: ["sh", "-c", "python scripts/seed_vectors.py --kb-dir /app/knowledge-base"]

  # ------------------------------------------------------- S3 storage (S3Mock)
  # S3-compatible object storage for media uploads (replaces MinIO, whose
  # images are no longer publicly pullable from Docker Hub or Quay.io).
  # The backend uses the generic AWS S3 SDK with path-style access, so no
  # backend code changes are needed. The app bucket is auto-created at
  # startup via COM_ADOBE_TESTING_S3MOCK_STORE_INITIAL_BUCKETS, which
  # replaces the old minio-init/mc step. Dev-only: never use in production
  # with real user data (S3Mock is a testing tool, no auth on objects).
  minio:
    image: adobe/s3mock:latest
    container_name: mindease-minio
    restart: unless-stopped
    # frontend membership is required for the dev overlay's localhost port
    # publish to take effect (Docker ignores published ports on
    # internal-only containers) and so client-facing presigned S3 URLs
    # (MINIO_PUBLIC_URL) stay reachable. S3Mock accepts any credentials and
    # is dev-only - never expose it beyond 127.0.0.1.
    networks: [frontend, internal]
    environment:
      COM_ADOBE_TESTING_S3MOCK_STORE_ROOT: /s3mockroot
      COM_ADOBE_TESTING_S3MOCK_STORE_RETAIN_FILES_ON_EXIT: "true"
      COM_ADOBE_TESTING_S3MOCK_STORE_INITIAL_BUCKETS: ${MINIO_BUCKET:-mindease-files}
    volumes:
      - s3mock-data:/s3mockroot
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9090/favicon.ico"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 10s

  # ---------------------------------------------------------------- Keycloak
  keycloak:
    image: quay.io/keycloak/keycloak:25.0
    container_name: mindease-keycloak
    restart: unless-stopped
    networks: [frontend]
    command: start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?set in .env}
      KC_HEALTH_ENABLED: "true"
    ports:
      - "${KEYCLOAK_PORT:-8080}:8080"
    volumes:
      - keycloak-data:/opt/keycloak/data
      - ./base/keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro
    healthcheck:
      test:
        - CMD
        - bash
        - -c
        - 'exec 3<>/dev/tcp/127.0.0.1/8080 && printf "GET /realms/mindease HTTP/1.0\r\nHost: localhost\r\n\r\n" >&3 && head -n1 <&3 | grep -q "200 OK"'
      interval: 15s
      timeout: 10s
      retries: 12
      start_period: 90s

  # ------------------------------------------------------------- Backend API
  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: mindease-backend
    restart: unless-stopped
    networks: [frontend, internal]
    depends_on:
      mongo: { condition: service_healthy }
      redis: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
      qdrant: { condition: service_healthy }
      keycloak: { condition: service_healthy }
    environment:
      <<: *common-env
      SERVER_PORT: 8080
      SPRING_DATA_MONGODB_URI: ${MONGODB_URI:?set in .env}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_DATA_REDIS_PASSWORD: ${REDIS_PASSWORD:?set in .env}
      SPRING_RABBITMQ_HOST: ${RABBITMQ_HOST:-rabbitmq}
      SPRING_RABBITMQ_PORT: ${RABBITMQ_PORT:-5672}
      SPRING_RABBITMQ_USERNAME: ${RABBITMQ_DEFAULT_USER:-mindease}
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_DEFAULT_PASS:?set in .env}
      AI_SERVICE_URL: http://ai-service:8000/api/v1
      QDRANT_URL: ${QDRANT_URL:-http://qdrant:6333}
      MINIO_URL: ${MINIO_URL:-http://minio:9090}
      MINIO_PUBLIC_URL: ${MINIO_PUBLIC_URL:-}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-mindease}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:?set in .env}
      MINIO_BUCKET: ${MINIO_BUCKET:-mindease-files}
      JWT_ISSUER: ${JWT_ISSUER:?set in .env}
      JWT_JWKS_URI: ${JWT_JWKS_URI:?set in .env}
      RABBITMQ_QUEUE_AI_TASKS: ${RABBITMQ_QUEUE_AI_TASKS:-ai_tasks}
      AI_INTERNAL_API_KEY: ${AI_INTERNAL_API_KEY:?set in .env (shared secret with ai-service)}
      AI_JOBS_MAX_ATTEMPTS: ${AI_JOBS_MAX_ATTEMPTS:-3}
      AI_JOBS_CLAIM_TIMEOUT: ${AI_JOBS_CLAIM_TIMEOUT:-5m}
      AI_JOBS_STALE_SWEEP_INTERVAL: ${AI_JOBS_STALE_SWEEP_INTERVAL:-60000}
      JOURNAL_ENCRYPTION_KEY: ${JOURNAL_ENCRYPTION_KEY:?set in .env (journal at-rest key)}
      MEDIA_ENCRYPTION_KEY: ${MEDIA_ENCRYPTION_KEY:-}
      JOURNAL_MIGRATE_PLAINTEXT: ${JOURNAL_MIGRATE_PLAINTEXT:-true}
      COMBINED_INSIGHT_CACHE_TTL: ${COMBINED_INSIGHT_CACHE_TTL:-30m}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.5-flash}
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8080/actuator/health || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 40s

  # ------------------------------------------------------------- AI service
  ai-service:
    image: ${AI_SERVICE_IMAGE:-mindease/ai-service:local}
    build:
      context: ../ai-service
      dockerfile: Dockerfile
    container_name: mindease-ai-service
    restart: unless-stopped
    networks: [frontend, internal]
    depends_on:
      rag-seed:
        condition: service_completed_successfully
    environment:
      <<: *common-env
      APP_HOST: 0.0.0.0
      APP_PORT: 8000
      LLM_PROVIDER: ${LLM_PROVIDER:-gemini}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.5-flash}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
      CORS_ALLOW_ORIGIN_REGEX: ${CORS_ALLOW_ORIGIN_REGEX:-}
      RATE_LIMIT_ENABLED: ${RATE_LIMIT_ENABLED:-true}
      RATE_LIMIT_PER_MINUTE: ${RATE_LIMIT_PER_MINUTE:-120}
      BACKEND_INTERNAL_URL: ${BACKEND_INTERNAL_URL:-http://backend:8080/api/v1/internal}
      AI_INTERNAL_API_KEY: ${AI_INTERNAL_API_KEY:?set in .env (shared secret with backend)}
      AI_INBOUND_AUTH_REQUIRED: ${AI_INBOUND_AUTH_REQUIRED:-true}
      AI_JOBS_MAX_ATTEMPTS: ${AI_JOBS_MAX_ATTEMPTS:-3}
      CALLBACK_ATTEMPTS: ${CALLBACK_ATTEMPTS:-3}
      CALLBACK_BACKOFF_SECONDS: ${CALLBACK_BACKOFF_SECONDS:-2}
      RABBITMQ_HOST: ${RABBITMQ_HOST:-rabbitmq}
      RABBITMQ_PORT: ${RABBITMQ_PORT:-5672}
      RABBITMQ_USERNAME: ${RABBITMQ_DEFAULT_USER:-mindease}
      RABBITMQ_PASSWORD: ${RABBITMQ_DEFAULT_PASS:?set in .env}
      AI_TASKS_QUEUE: ${RABBITMQ_QUEUE_AI_TASKS:-ai_tasks}
      QDRANT_URL: ${QDRANT_URL:-http://qdrant:6333}
      QDRANT_COLLECTION: ${QDRANT_COLLECTION:-mindease_chunks}
      RAG_ENABLED: ${RAG_ENABLED:-true}
      EMOTION_ENABLED: ${EMOTION_ENABLED:-true}
      EMOTION_MODEL_PATH: ${EMOTION_MODEL_PATH:-app/models/vit_fer_fp16.tflite}
      EMOTION_MODEL_VERSION: ${EMOTION_MODEL_VERSION:-vit-fer-7}
      EMOTION_CONFIDENCE_THRESHOLD: ${EMOTION_CONFIDENCE_THRESHOLD:-0.6}
      EMOTION_MARGIN_THRESHOLD: ${EMOTION_MARGIN_THRESHOLD:-0.10}
      EMOTION_NORMALIZATION: ${EMOTION_NORMALIZATION:-mean_std_0.5}
      # Use the ML models baked into the image (/app/model-cache) instead of
      # re-downloading from HuggingFace at runtime. External LLM APIs
      # (Gemini/OpenAI) still work - this only affects HF model loading.
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8000/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

networks:
  frontend:
    name: mindease-frontend
    driver: bridge
  internal:
    name: mindease-internal
    driver: bridge
    internal: true

volumes:
  mongo-data:
    name: mindease-mongo-data
  redis-data:
    name: mindease-redis-data
  rabbitmq-data:
    name: mindease-rabbitmq-data
  qdrant-data:
    name: mindease-qdrant-data
  s3mock-data:
    name: mindease-s3mock-data
  keycloak-data:
    name: mindease-keycloak-data
