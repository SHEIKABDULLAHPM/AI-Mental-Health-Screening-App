name: mindease
description: >-
  AI-Based Mental Health Screening & Support Guidance Flutter mobile app.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter

  # State management / DI
  provider: ^6.1.2
  get_it: ^7.7.0
  # Navigation
  go_router: ^14.2.7
  # Networking
  dio: ^5.6.0
  # Security: encrypted storage for tokens
  flutter_secure_storage: ^9.2.2
  # Permissions: runtime requests for notifications, microphone, camera & storage.
  permission_handler: ^11.3.7
  # Camera & on-device face detection for mood analysis
  camera: ^0.10.5+9
  google_mlkit_face_detection: ^0.12.0
  # On-device emotion classification via TFLite
  tflite_flutter: ^0.12.1
  # Media: image capture/selection and voice recording
  image_picker: ^1.1.2
  record: ^6.0.4
  just_audio: ^0.9.42
  mime: ^2.0.0
  path_provider: ^2.1.5
  path: ^1.9.1
  # Utilities
  intl: ^0.19.0
  equatable: ^2.0.5
  shared_preferences: ^2.5.5
  flutter_svg: ^2.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/logo/
    - assets/models/emotion_model.tflite

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter.ttf
          weight: 400
        - asset: assets/fonts/Inter.ttf
          weight: 500
        - asset: assets/fonts/Inter.ttf
          weight: 600
        - asset: assets/fonts/Inter.ttf
          weight: 700
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
          weight: 400
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
